title: Backblaze B2 usage reports
type: logs
streams:
  - input: aws-s3
    title: Backblaze B2 usage reports
    description: Collect daily per-bucket usage report CSVs that Backblaze B2 writes to the account's reports bucket.
    template_path: aws-s3.yml.hbs
    vars:
      - name: bucket_name
        type: text
        title: Usage Reports Bucket Name
        description: Name of the B2 bucket that receives usage reports, in the form `b2-reports-<accountId>`.
        required: true
        show_user: true
      - name: bucket_list_prefix
        type: text
        title: Bucket Prefix
        description: Object key prefix to list in the reports bucket. Leave empty to read all report dates.
        show_user: false
      - name: bucket_list_interval
        type: text
        title: Bucket List Interval
        description: How often to list the bucket for new report objects. Reports are written daily. Supported units are h, m, and s.
        required: true
        show_user: false
        default: 1h
      - name: number_of_workers
        type: integer
        title: Number of Workers
        description: Number of workers that process the listed report objects.
        required: true
        show_user: false
        default: 1
      - name: ignore_older
        type: text
        title: Ignore Older Timespan
        description: Skip report objects last modified longer ago than this duration, for example `2160h`. Useful to limit the initial backfill.
        show_user: false
      - name: start_timestamp
        type: text
        title: Start Timestamp
        description: Only read report objects last modified after this timestamp, in `YYYY-MM-DDTHH:MM:SSZ` format.
        show_user: false
      - name: proxy_url
        type: text
        title: Proxy URL
        description: URL of the proxy to use when connecting to B2, for example `http://proxy.example.com:8080`.
        show_user: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - backblaze_b2-usage
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`. Raw usage report rows include the account email address, which isn't indexed otherwise.
        required: true
        show_user: true
        default: false
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        show_user: false
elasticsearch:
  index_template:
    mappings:
      subobjects: false
