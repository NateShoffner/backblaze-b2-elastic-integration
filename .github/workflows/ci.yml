name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so stack tests still catch upstream stack drift on a quiet repo.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      stack_tests:
        description: Also run policy and system tests (boots a full stack, slow)
        type: boolean
        default: false

env:
  ELASTIC_PACKAGE_VERSION: v0.125.1

defaults:
  run:
    working-directory: packages/backblaze_b2

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elastic-package
        uses: ./.github/actions/setup-elastic-package

      - name: Check package
        run: elastic-package check -v

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: backblaze_b2-package
          path: build/packages/*.zip
          if-no-files-found: error

  pipeline-tests:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elastic-package
        uses: ./.github/actions/setup-elastic-package

      # Pipeline tests exercise ingest pipelines through the ES simulate API and
      # never touch Kibana or Fleet, so an Elasticsearch-only stack is enough.
      - name: Boot Elasticsearch
        run: elastic-package stack up -d -v --services elasticsearch

      - name: Run pipeline tests
        run: elastic-package test pipeline -v --report-format xUnit --report-output file

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-reports
          path: ~/.elastic-package/tmp/test-results/*.xml
          if-no-files-found: ignore

      - name: Tear down the stack
        if: always()
        run: elastic-package stack down -v

  stack-tests:
    name: Policy and system tests
    # Boots the full stack (Elasticsearch, Kibana, Fleet Server, agent) and the
    # docker-compose mock. Slow and resource-hungry, so it runs weekly and on
    # request rather than on every push. System tests cover the bucket data
    # stream; the aws-s3 streams have no docker-based mock.
    if: github.event_name == 'schedule' || inputs.stack_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elastic-package
        uses: ./.github/actions/setup-elastic-package

      - name: Boot up the stack
        run: elastic-package stack up -d -v

      - name: Run policy tests
        run: elastic-package test policy -v --report-format xUnit --report-output file

      - name: Run system tests
        run: elastic-package test system --data-streams bucket -v --report-format xUnit --report-output file

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-test-reports
          path: ~/.elastic-package/tmp/test-results/*.xml
          if-no-files-found: ignore

      - name: Tear down the stack
        if: always()
        run: elastic-package stack down -v
